# Exemplo didatico para inspecao estatica (Parte 3 - Shield-Right no Kubernetes)
# Politica Kyverno que bloqueia Pods com imagens nao assinadas via Cosign Keyless
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-payment-api-supply-chain
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-keyless-cosign-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/empresa-fintech/payment-api:*"
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/empresa-fintech/payment-api/.github/workflows/golden_pipeline_capstone.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
          attestations:
            - type: https://slsa.dev/provenance/v1
              conditions:
                - all:
                    - key: "{{ buildDefinition.externalParameters.workflow.ref }}"
                      operator: Equals
                      value: "refs/heads/main"
